# Blueprint Render untuk situs inspeksi tim: paket Free (tanpa kartu kredit), region Singapura (sama dengan Supabase).
# Render membangun image dari Dockerfile repo ini dan baru menerapkannya sesudah semua check GitHub (CI) lulus.
# Nilai bertanda sync: false diisi pemilik di dashboard saat Blueprint dibuat; tidak pernah ditulis di repo
# (CLAUDE.md R-019). Paket Free tidur sesudah 15 menit tanpa pengunjung dan bangun dalam sekitar satu menit.
services:
  - type: web
    name: memount
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Memount
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_DEMO
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: TRUSTED_PROXIES
        value: "*"
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: MAIL_MAILER
        value: log
      - key: FILESYSTEM_DISK
        value: local
      - key: REPORT_PHOTOS_DISK
        value: supabase
      - key: SUPABASE_STORAGE_ENDPOINT
        sync: false
      - key: SUPABASE_STORAGE_REGION
        value: ap-southeast-1
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: SUPABASE_STORAGE_KEY
        sync: false
      - key: SUPABASE_STORAGE_SECRET
        sync: false
      - key: DEVICE_KEY_SECRET
        generateValue: true
      - key: FIELD_PACK_ENABLED
        value: "true"
      - key: FIELD_SAFETY_ENABLED
        value: "true"
