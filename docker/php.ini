; Pengaturan PHP produksi untuk image Dockerfile, ditimpakan di atas php.ini-production.

; Foto laporan paling besar 4 MB dan berkas GPX 8 MB (config/hiking.php), ditambah ruang untuk isian formulir.
upload_max_filesize = 10M
post_max_size = 12M
memory_limit = 256M
expose_php = Off

; Kode di dalam image tidak berubah selama kontainer hidup, jadi opcache tidak perlu memeriksa stempel waktu berkas.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
