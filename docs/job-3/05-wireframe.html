<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">

<title>Memount · Wireframe (boxes)</title>
<style>
:root{--bg:#f2f2f0;--card:#fff;--ink:#222;--mut:#777;--ln:#9a9a95;--fill:#d9d9d5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--card:#222;--ink:#eee;--mut:#999;--ln:#666;--fill:#3a3a3a}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:12px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px 16px}
h1{font-size:20px;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 22px;max-width:700px}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin:26px 0 10px;padding-bottom:5px;border-bottom:1.5px solid var(--ln)}
.row{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.fr{width:200px}.lb{font-weight:700;font-size:11px;margin:0 0 5px}
.ph{border:2px solid var(--ink);border-radius:18px;background:var(--card);padding:12px 10px;display:flex;flex-direction:column;gap:8px;min-height:380px}
.ph.dk{background:#2a2a2a;--card:#3a3a3a;--ln:#888;--fill:#555;--ink:#eee}
.bx{border:1.5px solid var(--ln);border-radius:5px;min-height:30px}
.fl{background:var(--fill);border-color:var(--fill)}.dkb{background:var(--ink);border-color:var(--ink)}
.x{background:linear-gradient(to top right,transparent calc(50% - .7px),var(--ln) 50%,transparent calc(50% + .7px)),linear-gradient(to bottom right,transparent calc(50% - .7px),var(--ln) 50%,transparent calc(50% + .7px));background-color:var(--card)}
.ln{height:7px;border-radius:4px;background:var(--fill)}
.hd{height:14px;border-radius:4px;background:var(--ink);width:62%}
.ct{padding:8px;display:flex;flex-direction:column;gap:5px}
.sp{display:flex;gap:6px;flex-wrap:wrap}.sp>*{flex:1}
.pill{height:20px;min-width:34px;border:1.5px solid var(--ln);border-radius:12px;flex:0 0 auto}
.rw{display:flex;align-items:center;gap:7px;padding:0 8px;height:32px}
.rw i{width:11px;height:11px;border:1.5px solid var(--ln);flex:0 0 auto}.rw .ln{flex:1}
.nv{margin-top:auto;display:flex;justify-content:space-around;border-top:1.5px solid var(--ln);padding-top:8px}.nv i{width:18px;height:18px;border:1.5px solid var(--ln);border-radius:4px}.nv i.on{background:var(--ink);border-color:var(--ink)}
.tab{display:flex;height:26px;border:1.5px solid var(--ln);border-radius:6px;overflow:hidden}.tab i{flex:1;border-left:1.5px solid var(--ln)}.tab i:first-child{background:var(--ink);border:0}
</style></head><body>
<h1>MEMOUNT · Wireframe (boxes)</h1>
<p class="sub">Wireframe level paling rendah: hanya kotak dan garis, tanpa teks isi. Kotak ber-X = gambar/peta/grafik, kotak penuh gelap = tombol utama, kotak kosong = input/kartu/tombol sekunder.</p>
<div id="app"></div>
